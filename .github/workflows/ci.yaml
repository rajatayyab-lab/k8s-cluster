name: Build → Push → Deploy (ArgoCD)

on:
  push:
    branches:
      - test
    paths-ignore:
      - "**.md"
      - ".gitignore"

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  IMAGE_NAME: k8s-platform-ui
  MANIFEST_REPO: rajatayyab-lab/eks-manifest   # ← change this
  MANIFEST_BRANCH: test
  ARGOCD_APP_NAME: k8s-platform-ui
  ARGOCD_SERVER: https://argocd.local                    # ← e.g. argocd.k8s-platform.local

jobs:
  # ─────────────────────────────────────
  # JOB 1 — Build & Push to Docker Hub
  # ─────────────────────────────────────
  build-and-push:
    name: 🐳 Build & Push Image
    runs-on: ubuntu-latest
    ennvironment: test

    outputs:
      image_tag: ${{ steps.meta.outputs.short_sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag (short SHA)
        id: meta
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}
            ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest summary
        run: |
          echo "### 📦 Image pushed" >> $GITHUB_STEP_SUMMARY
          echo "\`${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────
  # JOB 2 — Update Manifest Repo (image tag)
  # ─────────────────────────────────────
  update-manifest:
    name: 📝 Update Deployment Manifest
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO }}
          ref: ${{ env.MANIFEST_BRANCH }}
          token: ${{ secrets.GH_PAT }}          # Personal Access Token with repo scope

      - name: Update image tag in deployment.yaml
        run: |
          NEW_TAG="${{ needs.build-and-push.outputs.image_tag }}"
          IMAGE="${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${NEW_TAG}"

          # Replace the image line (works for any previous tag format)
          sed -i "s|image: .*/${{ env.IMAGE_NAME }}:.*|image: ${IMAGE}|g" k8s-cluster/k8s-deployment.yaml

          echo "Updated deployment to image: ${IMAGE}"
          grep "image:" k8s-cluster/k8s-deployment.yaml

      - name: Commit and push manifest change
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add k8s-cluster/k8s-deployment.yaml

          if git diff --staged --quiet; then
            echo "No changes to commit — image tag unchanged."
            exit 0
          fi

          git commit -m "chore(deploy): update ${{ env.IMAGE_NAME }} → ${{ needs.build-and-push.outputs.image_tag }}

          Triggered by: ${{ github.event.head_commit.message }}
          Commit: ${{ github.sha }}
          Actor:  ${{ github.actor }}"

          git push origin ${{ env.MANIFEST_BRANCH }}

